name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/SportsHub.Web/package-lock.json
      - name: Restore .NET
        run: dotnet restore SportsHub.sln
      - name: Install frontend dependencies
        working-directory: src/SportsHub.Web
        run: npm ci
      - name: Build frontend
        working-directory: src/SportsHub.Web
        run: npm run build
      - name: Test frontend
        working-directory: src/SportsHub.Web
        run: npm test
      - name: Build .NET
        run: dotnet build SportsHub.sln --configuration Release --no-restore
      - name: Test .NET without database access
        run: dotnet test SportsHub.sln --configuration Release --no-build --no-restore
